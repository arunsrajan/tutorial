apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-shared
  namespace: camel-k
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
  volumeName: camel-sftp-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftp-shared-up-down
  namespace: camel-k
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
  volumeName: camel-sftp-pv1
