apiVersion: v1
kind: PersistentVolume
metadata:
  name: camel-sftp-pv
  namespace: camel-k
spec:
  capacity:
   storage: 2Gi
  accessModes:
   - ReadWriteOnce
  hostPath:
    path: "/mnt/hostpath/sftp-creds"
  storageClassName: standard
